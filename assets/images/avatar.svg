  <rect width="512" height="512" rx="256" fill="url(#bgGrad)"/>

  <!-- subtle grid -->
  <g opacity="0.12">
    <path d="M0 128H512M0 256H512M0 384H512" stroke="#7DD3FC" stroke-width="1"/>
    <path d="M128 0V512M256 0V512M384 0V512" stroke="#7DD3FC" stroke-width="1"/>
  </g>

  <circle cx="256" cy="256" r="228" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="196" stroke="url(#ringGrad)" stroke-width="2.5"/>

  <!-- decorative dots -->
  <circle cx="150" cy="150" r="4" fill="#7DD3FC" opacity="0.7"/>
  <circle cx="362" cy="150" r="3" fill="#38BDF8" opacity="0.6"/>
  <circle cx="108" cy="330" r="4" fill="#7DD3FC" opacity="0.5"/>
  <circle cx="404" cy="330" r="3" fill="#38BDF8" opacity="0.6"/>

  <!-- person silhouette -->
  <g clip-path="url(#ringClip)">
    <circle cx="256" cy="212" r="62" fill="url(#figureGrad)" opacity="0.95"/>
    <path d="M126 452C126 372 184 318 256 318C328 318 386 372 386 452V452H126V452Z" fill="url(#figureGrad)" opacity="0.95"/>
