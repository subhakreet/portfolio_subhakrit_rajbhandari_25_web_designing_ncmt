<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Subhakrit Rajbhandari avatar">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#0B0F14"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="96" y1="80" x2="416" y2="432" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DD3FC" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="figureGrad" x1="180" y1="140" x2="332" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#94A3B8"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 220) rotate(90) scale(260)">
